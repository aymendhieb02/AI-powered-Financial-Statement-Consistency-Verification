[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finverify"
version = "0.1.0"
description = "FinVerify local SICAV financial statement consistency checker."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
finverify = "sicav_checker.cli:main"
sicav-checker = "sicav_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
